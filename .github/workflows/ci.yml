name: CI

# Runs build and test on:
#   every push that has a change in a file not in the docs folder
#   every pull request with main branch as the base that has a change
#     in a file not in the docs folder
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Check and build codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset status` diffs against the base branch, so it needs the
          # full commit history (not the default shallow, single-branch clone).
          # `blob:none` keeps that cheap by fetching file contents on demand -
          # the name-only diff needs trees, not blobs, so it pulls none.
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: .nvmrc

      # Wireit cache
      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install

      # Validate the pending changesets before the release workflow does.
      # `changeset status` fails on a malformed or "mixed" changeset - one
      # that lists both published packages and private, unversioned packages
      # (which Changesets ignores). That combination aborts `changeset
      # version` on push to main, silently blocking all releases. Catching it
      # here fails the PR instead. See #1374.
      #
      # `changeset status` compares against `config.baseBranch` ("main"). On
      # pull_request builds the checkout is detached with no local `main`, so
      # recreate it from the fetched remote-tracking ref. Do not use
      # `--since`: it filters to packages changed since the ref and skips the
      # mixed-changeset check entirely.
      - name: Validate changesets
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          pnpm changeset status

      # If you hare having issues post-merge with wireit improperly caching,
      # comment this out, push a commit, then re-comment.
      # - name: Clear all caches
      #   run: pnpm clean:cache

      - name: Build Code and Examples
        run: pnpm run build

      # We build in-source files like `examples/one-page/index.html`.
      # This check ensures we don't build changes that need committing.
      - name: Check generated in-source files
        run: git diff --no-ext-diff --quiet --exit-code

      - name: Check Code
        run: pnpm run check:ci
